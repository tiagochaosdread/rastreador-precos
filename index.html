```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Rastreador de Preços</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f3f5f9;
      color: #202938;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1150px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px #0000000a;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 16px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* GRADE DOS PRODUTOS */

    #products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    /* CARD INDIVIDUAL */

    .product {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: transform .2s, box-shadow .2s;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px #00000012;
    }

    .product-image {
      width: 100%;
      height: 210px;
      object-fit: contain;
      background: #f8f9fb;
      padding: 15px;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .product-info a {
      color: #2563eb;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 16px;
    }

    .product-info a:hover {
      text-decoration: underline;
    }

    .price-label {
      color: #667085;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      color: #16a34a;
      margin: 0 0 16px;
      overflow-wrap: anywhere;
    }

    .target-box {
      background: #f3f6fb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .target-price {
      font-size: 18px;
      font-weight: bold;
      color: #344054;
      margin-top: 5px;
    }

    .status {
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
      margin-top: auto;
      padding-top: 5px;
    }

    .delete {
      background: #dc3545;
      width: 100%;
      margin-top: 14px;
    }

    .delete:hover {
      background: #bb2635;
    }

    #message {
      margin-top: 14px;
      font-size: 14px;
    }

    .empty {
      color: #667085;
      padding: 12px 0;
      grid-column: 1 / -1;
    }

    .muted {
      color: #667085;
      font-size: 14px;
    }

    /* RESPONSIVIDADE */

    @media (max-width: 850px) {
      #products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .product-image {
        height: 190px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px 12px;
      }

      .card {
        padding: 18px;
      }

      #products {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .product-image {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>Meu Rastreador de Preços</h1>

  <p class="subtitle">
    Acompanhe produtos e encontre o melhor momento para comprar.
  </p>

  <!-- CADASTRO DE PRODUTOS -->

  <section class="card">

    <h2>Adicionar produto</h2>

    <form id="productForm">

      <label for="name">Nome do produto</label>

      <input
        id="name"
        required
        maxlength="200"
        placeholder="Ex.: Monitor Gamer 27 polegadas"
      >

      <label for="url">Link do produto</label>

      <input
        id="url"
        type="url"
        required
        maxlength="2048"
        placeholder="https://loja.com/produto"
      >

      <label for="target">Preço desejado (R$)</label>

      <input
        id="target"
        type="number"
        min="0.01"
        step="0.01"
        required
        placeholder="Ex.: 1200"
      >

      <button id="submitButton" type="submit">
        Adicionar à lista
      </button>

    </form>

    <div id="message" role="status"></div>

  </section>

  <!-- PRODUTOS MONITORADOS -->

  <section class="card">

    <h2>Produtos monitorados</h2>

    <div id="products">
      <p class="muted">Carregando produtos...</p>
    </div>

  </section>

</main>

<script>

  const form = document.getElementById("productForm");
  const message = document.getElementById("message");
  const productsArea = document.getElementById("products");
  const submitButton = document.getElementById("submitButton");

  // FORMATAÇÃO DE PREÇOS

  function money(value) {

    if (value === null || value === undefined) {
      return "Ainda não consultado";
    }

    return Number(value).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

  }

  // FORMATAÇÃO DE DATA E HORA BRASILEIRAS

  function formatDateTime(value) {

    if (!value) {
      return "Aguardando primeira consulta";
    }

    let dateString = String(value).trim();

    // Trata datas SQL sem indicação de fuso como UTC.
    // Exemplo: 2026-11-04 23:15:00
    if (
      /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(dateString)
    ) {
      dateString = dateString.replace(" ", "T") + "Z";
    }

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return "Data indisponível";
    }

    return new Intl.DateTimeFormat("pt-BR", {
      timeZone: "America/Sao_Paulo",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).format(date);

  }

  // CARREGAR PRODUTOS

  async function loadProducts() {

    productsArea.textContent = "Carregando...";

    try {

      const response = await fetch("/api/products");

      if (!response.ok) {
        throw new Error("Não foi possível consultar o banco.");
      }

      const products = await response.json();

      productsArea.replaceChildren();

      if (products.length === 0) {

        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Você ainda não cadastrou produtos.";

        productsArea.appendChild(empty);

        return;
      }

      products.forEach(product => {

        const item = document.createElement("div");
        item.className = "product";

        // IMAGEM

        const img = document.createElement("img");

        img.className = "product-image";
        img.alt = product.name;
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        if (product.image_url) {

          img.src = product.image_url;

          img.onerror = () => {
            img.style.display = "none";
          };

        } else {

          img.style.display = "none";

        }

        // INFORMAÇÕES

        const info = document.createElement("div");
        info.className = "product-info";

        const title = document.createElement("h3");
        title.textContent = product.name;

        const link = document.createElement("a");

        link.href = product.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Ver produto na loja ↗";

        // PREÇO ATUAL

        const currentLabel = document.createElement("div");
        currentLabel.className = "price-label";
        currentLabel.textContent = "Preço atual";

        const current = document.createElement("p");
        current.className = "price";
        current.textContent = money(product.current_price);

        // PREÇO DESEJADO

        const targetBox = document.createElement("div");
        targetBox.className = "target-box";

        const targetLabel = document.createElement("div");
        targetLabel.className = "price-label";
        targetLabel.textContent = "Seu preço desejado";

        const target = document.createElement("div");
        target.className = "target-price";
        target.textContent = money(product.target_price);

        targetBox.append(targetLabel, target);

        // DATA DA ÚLTIMA CONSULTA

        const status = document.createElement("p");
        status.className = "status";

        status.textContent = product.last_checked_at
          ? "Última consulta: " + formatDateTime(product.last_checked_at)
          : "Aguardando primeira consulta de preço";

        // EXCLUIR

        const remove = document.createElement("button");

        remove.className = "delete";
        remove.textContent = "Excluir";

        remove.addEventListener("click", () => {
          deleteProduct(product.id);
        });

        info.append(
          title,
          link,
          currentLabel,
          current,
          targetBox,
          status,
          remove
        );

        item.append(img, info);

        productsArea.appendChild(item);

      });

    } catch (error) {

      productsArea.textContent = error.message;

    }

  }

  // CADASTRAR PRODUTO

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    submitButton.disabled = true;

    message.textContent = "Salvando produto...";

    try {

      const data = {

        name: document.getElementById("name").value.trim(),

        url: document.getElementById("url").value.trim(),

        target_price: Number(
          document.getElementById("target").value
        )

      };

      const response = await fetch("/api/products", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

      });

      const result = await response.json();

      if (!response.ok) {

        throw new Error(
          result.error || "Erro ao cadastrar produto."
        );

      }

      form.reset();

      message.textContent = result.message ||
        "Produto cadastrado com sucesso!";

      await loadProducts();

    } catch (error) {

      message.textContent = error.message;

    } finally {

      submitButton.disabled = false;

    }

  });

  // EXCLUIR PRODUTO

  async function deleteProduct(id) {

    if (!confirm("Deseja realmente excluir este produto?")) {
      return;
    }

    try {

      const response = await fetch(
        "/api/products?id=" + encodeURIComponent(id),
        {
          method: "DELETE"
        }
      );

      if (!response.ok) {

        const result = await response.json();

        throw new Error(
          result.error || "Não foi possível excluir o produto."
        );

      }

      message.textContent = "Produto excluído com sucesso.";

      await loadProducts();

    } catch (error) {

      message.textContent = error.message;

    }

  }

  // INICIALIZAÇÃO

  loadProducts();

</script>

</body>
</html>
```
